name: CI

# Three things run here, and none of them needs Omarchy installed.
#
# The unit tests cover rule generation, escaping and the rule store, and the
# file-I/O check runs the shell Roost reads and writes with against symlinks,
# devices, pipes and a directory it cannot write to. The Lua check compiles what
# the generator writes: Roost's output is required by the
# user's Hyprland config, so a syntax error there is not a broken plugin, it is
# a broken desktop, and it is the one failure worth a job of its own. The
# listing checks cover what the marketplace re-verifies every day for as long as
# the plugin stays listed — a repository that fails them loses its install
# button within a day, silently.
#
# The first-run job runs the real service under Quickshell, which is the only
# check here that exercises QML rather than the logic behind it. It needs Arch,
# because that is where Quickshell is packaged — and tracking Arch is the point
# rather than the cost: this plugin's host is a rolling distribution, so a job
# that goes red because Quickshell changed underneath it is telling us something
# before our users find it.
#
# What is deliberately absent: qmllint and `omarchy plugin validate`. Both need
# Omarchy's own QML modules on the import path, which the container does not
# have, so a job pretending to check them would only ever report that it could
# not resolve the imports. Run both locally before publishing.

on:
  push:
    branches: [master]
    # Without this the workflow never fires on a tag, and the version check
    # below — whose whole condition is "we are on a tag" — could never run.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run the rule tests
        run: node --test

      # The two scripts Roost reads and writes its files with live as string
      # literals in Service.qml, where no unit test can reach them. This pulls
      # them out and points a hostile filesystem at them.
      - name: The file I/O holds against a hostile filesystem
        run: ./test/file-io.sh

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install a Lua compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      # Hyprland embeds Lua, so `luac -p` answers the same question its parser
      # does: would this file load. The generator is fed class names chosen to
      # break naive escaping.
      - name: Every generated rule file compiles
        run: ./test/lua-syntax.sh

  first-run:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # `extra`, not the AUR, so this is one package and no build.
      - name: Install Quickshell
        run: pacman -Syu --noconfirm --needed quickshell git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No compositor and no session: the service opens no windows, so it runs
      # against the offscreen platform with a runtime directory of its own.
      - name: A machine that has never run Roost
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_RUNTIME_DIR: /tmp/runtime
          # The script skips when there is no `qs`, which is right for someone
          # running the suite on a machine without Quickshell and wrong here:
          # it would report success for a check it never ran.
          ROOST_REQUIRE_QS: "1"
        run: |
          mkdir -p /tmp/runtime
          ./test/first-run.sh

  listable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: A README and a licence exist at the root
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENCE || test -f COPYING

      - name: The manifest parses and declares this plugin
        run: |
          jq -e '.schemaVersion == 1' manifest.json > /dev/null
          jq -e '.id == "eduardodallecort.roost"' manifest.json > /dev/null
          jq -e '.license and .author and .description' manifest.json > /dev/null

      # `entry`, not `path`: in zsh `path` is the array tied to $PATH, and
      # reading into it empties the shell's search path. This job runs under
      # bash, where it is an ordinary name — but a line like this gets pasted
      # into whatever interactive shell is debugging it, and zsh is a common
      # enough choice for that to bite. It bit while this file was written.
      - name: Every declared entry point exists
        run: |
          jq -r '.entryPoints | to_entries[] | .value' manifest.json |
            while read -r entry; do
              test -f "$entry" || { echo "missing entry point: $entry"; exit 1; }
            done

      # Only on a tag build. Pushing the branch skips this; pushing the tag
      # afterwards is what exercises it.
      - name: The version in the manifest matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(jq -r '.version' manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          test "$manifest" = "$tag" || {
            echo "manifest.json says $manifest, tag says $tag"; exit 1; }

      # A symlink anywhere in the tree fails marketplace validation, and nothing
      # local complains: the listing simply breaks on the next daily check.
      - name: No symlinks in the plugin folder
        run: |
          found=$(find . -path ./.git -prune -o -type l -print)
          test -z "$found" || { echo "symlinks found:"; echo "$found"; exit 1; }

      # The catalogue tries preview.* in extension order, so a second file in a
      # higher-priority format silently wins over the one already there,
      # whatever its date. This step is red until the preview is committed,
      # which is correct: without one the plugin is not listable.
      - name: Exactly one preview image
        run: |
          found=""
          for candidate in preview.png preview.webp preview.jpg preview.jpeg preview.avif; do
            test -f "$candidate" && found="$found $candidate"
          done
          count=$(echo $found | wc -w)
          test "$count" -eq 1 || { echo "expected one preview.*, found:$found"; exit 1; }
          echo "preview:$found"
